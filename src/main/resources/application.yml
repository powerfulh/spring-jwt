spring:
  application:
    name: spring-jwt
  profiles:
    active: local
  datasource:
    url: ${MARIADBDOMAIN}
    username: powerfulh
    password: ${MARIADBPASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

jwt:
  secret: ${JWTSECRET}
  access-token-ttl: PT30M
  issuer: spring-jwt

server:
  port: 8080
