spring:
  application:
    name: jwt
  profiles:
    active: local
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${MARIADBDOMAIN}
    username: powerfulh
    password: ${MARIADBPASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWTSECRET:dev-only-default-secret-key-please-change-in-production-environment}
  expiration-millis: 3600000
